# cc3dsfs kiosk settings. Installed to /etc/cc3dsfs/kiosk.conf.
# After editing: sudo systemctl restart cc3dsfs

# HDMI output mode as WIDTHxHEIGHT@REFRESH. Use a standard 60 Hz mode
# that your display or upscaler (e.g. a Morph 4K) accepts.
# 1080p gives the 3DS screens a clean 2x scale when stacked.
# List what the display offers with: sudo cc3dsfs-kiosk --list-modes
# Leave empty to use the display's preferred mode.
MODE=1920x1080@60

# Display connector, e.g. HDMI-A-1 or HDMI-A-2. Empty = first connected one.
# On a Pi 400 / Pi 4, HDMI-A-1 is the port next to the USB-C power socket.
# List connectors with: sudo cc3dsfs-kiosk --list-outputs
OUTPUT=

# Renderer: "linuxkms" uses the GPU (recommended); "linuxkms-software"
# renders on the CPU if the GPU path does not work.
BACKEND=linuxkms

# Rotate the whole display: 0, 90, 180 or 270.
ROTATION=0
