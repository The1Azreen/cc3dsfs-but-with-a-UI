# Linux / Raspberry Pi: draw straight to the display through DRM/KMS
# (no X11 or Wayland needed) for kiosk mode, reading input with libinput.
# The software renderer is a fallback for GPUs without usable OpenGL ES.
[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "1.18.1", features = ["backend-linuxkms-noseat", "renderer-software"] }

# Windows: HDR output window rendered with Direct3D 11 (Slint draws SDR only).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D_Fxc",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

