name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@stable
    - uses: Swatinem/rust-cache@v2
    - name: Test
      run: cargo test
    - name: Build release
      run: cargo build --release
    - name: Package
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force cc3dsfs | Out-Null
        Copy-Item target/release/cc3dsfs.exe, target/release/FTD3XX.dll, target/release/ftd2xx.dll, LICENSE, README.md cc3dsfs/
        Copy-Item -Recurse "other licenses" cc3dsfs/
    - uses: actions/upload-artifact@v4
      with:
        name: cc3dsfs_windows_x64
        path: cc3dsfs
